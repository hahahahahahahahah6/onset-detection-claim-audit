[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "onset-detection-claim-audit"
version = "0.1.0"
description = "Offline documentation claim auditor for Python projects"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
onset-detection-claim-audit = "onset_detection_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["onset_detection_claim_audit*"]
